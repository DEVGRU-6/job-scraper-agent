name: Daily Job Scraper

on:
  schedule:
    # Runs automatically at 8:00 AM UTC on Mon, Wed, and Fri
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch: # Still allows you to trigger it manually anytime!
# 👇 Tells GitHub to use the new engine and stop the warnings 👇
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4 

    - name: Set up Python
      uses: actions/setup-python@v5 
      with:
        python-version: '3.11'

    # 👇 ADDED LANGDETECT HERE 👇
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper requests beautifulsoup4 google-genai gspread langdetect

    - name: Run Target Company Scraper (Cloudscraper + Gemini)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python main.py

    - name: Run Global Job Aggregator (Adzuna API)
      env:
        ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
        ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python api_scraper.py

    - name: Run LinkedIn Aggregator (RapidAPI)
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python linkedin_scraper.py
